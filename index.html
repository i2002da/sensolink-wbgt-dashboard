<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>체감온도 센서 데이터</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    padding: 2vh 3vw;
    overflow: hidden;
  }
  header {
    text-align: center;
    flex: 0 0 auto;
    margin-bottom: 1.5vh;
  }
  h1 {
    font-size: 2.6rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: #94a3b8;
    font-size: 1.2rem;
    margin: 0;
  }

  .sites {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2vw;
  }
  .site-block {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .site-block h2 {
    font-size: 1.5rem;
    margin: 0 0 1vh 6px;
    color: #f1f5f9;
    border-left: 6px solid #38bdf8;
    padding-left: 14px;
    flex: 0 0 auto;
  }

  .hero-card {
    background: #1e293b;
    border-radius: 20px;
    border: 1px solid #334155;
    flex: 1.3 1 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-bottom: 1.2vh;
  }
  .hero-label {
    font-size: 1.3rem;
    color: #94a3b8;
    margin-bottom: 0.5vh;
  }
  .hero-value {
    font-size: clamp(2.5rem, 9vh, 7.5rem);
    font-weight: 700;
    line-height: 1;
    color: #fb923c;
  }

  .sub-cards {
    flex: 1 1 0;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1vw;
    margin-bottom: 1vh;
  }
  .sub-cards .card {
    background: #1e293b;
    border-radius: 18px;
    border: 1px solid #334155;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 0;
  }
  .sub-cards .card .label {
    font-size: 1.1rem;
    color: #94a3b8;
    margin-bottom: 0.4vh;
  }
  .sub-cards .card .value {
    font-size: clamp(1.8rem, 6.2vh, 5rem);
    font-weight: 700;
    line-height: 1;
  }
  .sub-cards .card.temp .value { color: #38bdf8; }
  .sub-cards .card.hum .value { color: #34d399; }

  .time-line {
    flex: 0 0 auto;
    text-align: center;
    color: #64748b;
    font-size: 1rem;
  }

  footer {
    flex: 0 0 auto;
    text-align: center;
    color: #64748b;
    font-size: 1.05rem;
    margin-top: 1.2vh;
  }
  footer.error { color: #f87171; }
</style>
</head>
<body>
  <header>
    <h1>체감온도 센서 데이터</h1>
    <p class="subtitle">sensolink.kr 실시간 대시보드 · 5분 주기 갱신</p>
  </header>

  <div class="sites">
    <div class="site-block">
      <h2 id="site5-name">천안아이파크 5단지</h2>
      <div class="hero-card">
        <div class="hero-label">체감온도</div>
        <div class="hero-value" id="site5-feel">--</div>
      </div>
      <div class="sub-cards">
        <div class="card temp"><div class="label">온도</div><div class="value" id="site5-temp">--</div></div>
        <div class="card hum"><div class="label">습도</div><div class="value" id="site5-hum">--</div></div>
      </div>
      <div class="time-line">발생일시 <span id="site5-time">--</span></div>
    </div>

    <div class="site-block">
      <h2 id="site6-name">천안아이파크 6단지</h2>
      <div class="hero-card">
        <div class="hero-label">체감온도</div>
        <div class="hero-value" id="site6-feel">--</div>
      </div>
      <div class="sub-cards">
        <div class="card temp"><div class="label">온도</div><div class="value" id="site6-temp">--</div></div>
        <div class="card hum"><div class="label">습도</div><div class="value" id="site6-hum">--</div></div>
      </div>
      <div class="time-line">발생일시 <span id="site6-time">--</span></div>
    </div>
  </div>

  <footer id="status">불러오는 중...</footer>

<script>
function fmt(v, unit) {
  return (v !== null && v !== undefined) ? v + unit : '--';
}

function formatKST(date) {
  const parts = new Intl.DateTimeFormat('sv-SE', {
    timeZone: 'Asia/Seoul',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false
  }).formatToParts(date);
  const p = {};
  parts.forEach(({type, value}) => { p[type] = value; });
  return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}:${p.second}`;
}

function renderSite(prefix, site) {
  if (!site) return;
  if (site.name) document.getElementById(prefix + '-name').textContent = site.name;
  document.getElementById(prefix + '-feel').textContent = fmt(site.perceivedTemperature, '°C');
  document.getElementById(prefix + '-temp').textContent = fmt(site.temperature, '°C');
  document.getElementById(prefix + '-hum').textContent = fmt(site.humidity, '%');
  document.getElementById(prefix + '-time').textContent = site.occurredAt || '--';
}

async function load() {
  const statusEl = document.getElementById('status');
  try {
    const res = await fetch('./data.json?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();

    renderSite('site5', d.site5);
    renderSite('site6', d.site6);

    const checkedAtKST = formatKST(new Date());
    const collectedAtKST = d.updatedAt ? formatKST(new Date(d.updatedAt)) : null;

    statusEl.classList.remove('error');
    statusEl.textContent = '마지막 확인(내 화면): ' + checkedAtKST + ' KST' +
      (collectedAtKST ? ' · 서버 데이터 수집: ' + collectedAtKST + ' KST' : '');
  } catch (e) {
    statusEl.classList.add('error');
    statusEl.textContent = '데이터 로드 실패: ' + e.message;
  }
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
